# Copy this file to .github/workflows/aeos-verify.yml in a repository that has
# AEOS installed, and replace <owner>/aeos with the actual AEOS repository.
# It fails the check when AEOS-managed files were hand-edited, deleted, or are
# stale relative to the pinned AEOS version.
name: AEOS Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: <owner>/aeos@main
        with:
          mode: doctor
