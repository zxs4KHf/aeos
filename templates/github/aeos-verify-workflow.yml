# Copy this file to .github/workflows/aeos-verify.yml in a repository that has
# AEOS installed.
# It fails the check when AEOS-managed files were hand-edited, deleted, or are
# stale relative to the pinned AEOS version.
name: AEOS Verify

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: zxs4KHf/aeos@main
        with:
          mode: doctor
